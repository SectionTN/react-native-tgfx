name: Release

# Runs only after CI has gone green on main, so a release can never be cut from
# a commit that failed typecheck, tests, or the codegen check.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

defaults:
  run:
    shell: bash

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    # The release commit itself pushes to main and retriggers CI; without this
    # guard that second green run would cut another release, forever.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore: release ')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # release-it reads every tag to work out the next version from the
          # conventional commits since the last one.
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing needs npm 11.5.1+; the runner ships older.
      - run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Release
        working-directory: packages/react-native-tgfx
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: npm exec -- release-it --ci
