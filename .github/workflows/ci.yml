name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No pipelines here today; `shell: bash` is the alias carrying -o pipefail, so
# one added later cannot silently report success. review.yml is where it bites.
defaults:
  run:
    shell: bash

jobs:
  package:
    name: Package (typecheck, tests, codegen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Every workspace package, not a hardcoded one: the second package that
      # was added went untested for exactly as long as this line named the
      # first. `shell: bash` carries -e, so a failure inside the loop aborts it.
      - name: Typecheck
        run: for p in packages/*/; do (cd "$p" && bun run typecheck); done
      - name: Unit tests
        run: for p in packages/*/; do (cd "$p" && bun run test); done
      # `lint`/`format` themselves rewrite files, so CI runs the checking pair.
      - name: Lint
        run: for p in packages/*/; do (cd "$p" && bun run lint:check); done
      - name: Formatting
        run: for p in packages/*/; do (cd "$p" && bun run format:check); done
      - name: Benchmark acceptance gate tests
        run: bun test benchmarks/renderer-benchmark/scripts
      - name: Nitrogen output is committed and in sync
        run: |
          for p in packages/*/; do (cd "$p" && bunx nitrogen); done
          if ! git diff --quiet -- 'packages/*/nitrogen/*'; then
            echo "::error::nitrogen output is stale — run 'bunx nitrogen' in the package and commit the result"
            git diff --stat -- 'packages/*/nitrogen/*'
            exit 1
          fi
      - name: Tarball carries the entrypoints and the legal files
        working-directory: packages/react-native-tgfx
        run: |
          rm -rf lib
          npm pack --silent
          # Herestring, not a pipe: `grep -q` would SIGPIPE tar and trip pipefail.
          entries=$(tar -tzf react-native-tgfx-*.tgz)
          for f in package/lib/index.js package/lib/index.d.ts package/LICENSE package/NOTICE; do
            if ! grep -qx "$f" <<<"$entries"; then
              echo "::error::$f is missing from the packed tarball"
              exit 1
            fi
          done
          rm -f react-native-tgfx-*.tgz

  # #165: the published tarball shipped none of tgfx's vendored dependencies for
  # two releases, because every local and CI build reads them out of the
  # submodule and nothing ever installed the packed artifact.
  installable:
    name: Packed tarball installs and carries a buildable tgfx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - name: Verify the tgfx submodule is populated
        run: |
          if [ ! -f packages/react-native-tgfx/cpp/third_party/tgfx/CMakeLists.txt ]; then
            echo "::error::tgfx submodule is empty — PERSONAL_ACCESS_TOKEN needs read access to riteshshukla04/tgfx-private"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Pack
        working-directory: packages/react-native-tgfx
        run: |
          rm -rf lib
          npm pack --silent --pack-destination "$RUNNER_TEMP"
      # Deliberately not --ignore-scripts: the postinstall that fetches the
      # vendored dependencies is the thing under test.
      - name: Install the tarball into a scratch app
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p scratch && cd scratch
          echo '{"name":"scratch","private":true,"version":"1.0.0"}' > package.json
          npm install --no-audit --no-fund ../react-native-tgfx-*.tgz
      - name: The installed package has everything the Android configure step reads
        working-directory: ${{ runner.temp }}/scratch/node_modules/react-native-tgfx
        run: |
          for f in cpp/third_party/tgfx/CMakeLists.txt \
                   cpp/third_party/tgfx/src/gpu/Texture.cpp \
                   cpp/third_party/tgfx/third_party/vendor_tools/vendor.cmake \
                   cpp/third_party/tgfx/third_party/vendor_tools/ios.toolchain.cmake; do
            if [ ! -f "$f" ]; then
              echo "::error::$f missing after a clean install — a fresh app cannot build"
              exit 1
            fi
          done

  native-changes:
    name: Native paths changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Herestring, not a pipe: `grep -q` would SIGPIPE git and trip pipefail.
          files=$(git diff --name-only "$BASE" HEAD)
          if grep -qE '^packages/[^/]+/(android|ios|cpp)/' <<<"$files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  ios:
    name: iOS Simulator build
    # 20-30 min each: dispatched every fifth merged PR, and on any PR that
    # touches android/ios/cpp — a Kotlin, Swift or C++ regression would
    # otherwise merge without ever being compiled.
    needs: native-changes
    if: github.event_name == 'workflow_dispatch' || needs.native-changes.outputs.changed == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Fetch tgfx third-party dependencies
        working-directory: packages/react-native-tgfx/cpp/third_party/tgfx
        run: ./install_tools.sh && ./sync_deps.sh
      - name: Build the tgfx static library
        run: bash packages/react-native-tgfx/scripts/build-tgfx-ios.sh
      # Built, not run: they need a Metal device. `bun test` only exercises the
      # header-only harness programs, so this is the one place SceneTest — where
      # the scene reader's bounds behaviour is asserted — is compiled at all.
      # macOS because cpp/tests/CMakeLists.txt forces TGFX_USE_METAL.
      - name: Build the C++ tests
        working-directory: packages/react-native-tgfx/cpp/tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j3
      - name: Install pods
        working-directory: benchmarks/renderer-benchmark
        run: |
          npm ci
          cd ios && pod install
      # Compile only: this is the step that would have caught the unwrapped
      # baseAddress, and the only one that compiles the Swift and Obj-C++ at all.
      - name: Build
        working-directory: benchmarks/renderer-benchmark/ios
        run: |
          xcodebuild -workspace RendererBenchmark.xcworkspace \
            -scheme RendererBenchmark -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build

  leak:
    name: Memory-leak soak (emulator)
    # Dispatch-only: it costs an emulator hour. The soak churns every
    # allocation path; GPU-side growth still needs a real device, because the
    # hosted emulator's software renderer draws image scenes blank.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Fetch tgfx third-party dependencies
        working-directory: packages/react-native-tgfx/cpp/third_party/tgfx
        run: ./install_tools.sh && ./sync_deps.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the example debug APK
        working-directory: apps/example/android
        run: ./gradlew assembleDebug -x lint -PTgfxVulkan=OFF -PreactNativeArchitectures=x86_64
      - name: Soak on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          avd-name: ci-avd
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r apps/example/android/app/build/outputs/apk/debug/app-debug.apk
            HARNESS_APP_PATH=apps/example/android/app/build/outputs/apk/debug/app-debug.apk \
              node scripts/leak-check.mjs --runner ci-emu

  android:
    name: Android release build
    # 20-30 min each: dispatched every fifth merged PR, and on any PR that
    # touches android/ios/cpp.
    needs: native-changes
    if: github.event_name == 'workflow_dispatch' || needs.native-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Fetch tgfx third-party dependencies
        working-directory: packages/react-native-tgfx/cpp/third_party/tgfx
        run: ./install_tools.sh && ./sync_deps.sh
      - name: Assemble
        working-directory: benchmarks/renderer-benchmark
        run: |
          npm ci
          cd android && ./gradlew assembleRelease -x lint
