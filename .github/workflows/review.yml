name: Review

# Automated review pass on every pull request. Separate from ci.yml on purpose:
# CI answers "does it build and pass", this answers "is the change acceptable"
# and leaves its findings on the PR as a comment.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Static review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Lint
        id: lint
        working-directory: packages/react-native-tgfx
        continue-on-error: true
        run: bunx eslint "**/*.{js,ts,tsx}" --max-warnings 0 2>&1 | tee /tmp/lint.txt

      - name: Formatting
        id: format
        working-directory: packages/react-native-tgfx
        continue-on-error: true
        run: bunx prettier --check "src/**/*.{ts,tsx}" 2>&1 | tee /tmp/format.txt

      # The generated bindings must match the spec, or the native side silently
      # drifts from the TypeScript API.
      - name: Nitrogen output is in sync
        id: codegen
        continue-on-error: true
        run: |
          (cd packages/react-native-tgfx && bunx nitrogen)
          git diff --exit-code -- packages/react-native-tgfx/nitrogen 2>&1 | tee /tmp/codegen.txt

      # A change to the draw-program format is only safe if both ends move
      # together, so flag it for a human rather than trying to judge it here.
      - name: Wire-format change needs both ends
        id: wire
        continue-on-error: true
        run: |
          BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)
          JS=$(git diff --name-only $BASE HEAD -- packages/react-native-tgfx/src/compiler/writer.ts | wc -l)
          NATIVE=$(git diff --name-only $BASE HEAD -- packages/react-native-tgfx/cpp/TgfxScene.cpp | wc -l)
          if [ "$JS" -ne "$NATIVE" ]; then
            echo "writer.ts and TgfxScene.cpp changed independently — the binary draw program is written by one and read by the other, so check they still agree." | tee /tmp/wire.txt
            exit 1
          fi

      - name: Comment findings
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const read = (f) => { try { return fs.readFileSync(f, 'utf8').trim() } catch { return '' } }
            const checks = [
              ['Lint', '${{ steps.lint.outcome }}', read('/tmp/lint.txt')],
              ['Formatting', '${{ steps.format.outcome }}', read('/tmp/format.txt')],
              ['Nitrogen in sync', '${{ steps.codegen.outcome }}', read('/tmp/codegen.txt')],
              ['Wire format', '${{ steps.wire.outcome }}', read('/tmp/wire.txt')],
            ]
            const failed = checks.filter(([, outcome]) => outcome === 'failure')
            const body = failed.length === 0
              ? '### Review: no findings\n\nLint, formatting, codegen sync and wire-format checks all passed.'
              : ['### Review found ' + failed.length + ' issue(s)', '',
                 ...failed.map(([name, , out]) => `**${name}**\n\n\`\`\`\n${out.slice(0, 3000)}\n\`\`\``)].join('\n')
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            })
            if (failed.length > 0) core.setFailed(failed.length + ' review check(s) failed')
